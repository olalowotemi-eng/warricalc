<script>
const cutoffs = {Medicine:70, Law:68, Pharmacy:68, Nursing:66, Engineering:60, Computer:60, Accounting:55, MassComm:58, Business:52, Others:45};
function autoCutoff(){let d=document.getElementById('dept').value; if(cutoffs[d]) document.getElementById('cutoffInput').value=cutoffs[d];}
function calcAgg(){
 let school=document.getElementById('school').value; let dept=document.getElementById('dept').value;
 let jamb=parseFloat(document.getElementById('jamb').value); let post=parseFloat(document.getElementById('post').value);
 let cutoff=parseFloat(document.getElementById('cutoffInput').value)||50;
 if(!school){alert('Select school');return;} if(isNaN(jamb)||isNaN(post)){alert('Put JAMB and Post UTME');return;}
 let jp=jamb/8; let pp=post/2; let agg=jp+pp; let diff=agg-cutoff; let status= agg>=cutoff? `✅ PASS for ${dept} in ${school}` : `❌ Need ${(cutoff-agg).toFixed(1)}% more. Try change course`;
 document.getElementById('output').style.display='block';
 document.getElementById('output').innerHTML=`<div class="small">${school}</div><div class="grade">${agg.toFixed(2)}%</div><div style="font-size:13px;">JAMB ${jamb}/8=${jp.toFixed(2)} + Post ${post}/2=${pp.toFixed(2)}<br>Cut-off: ${cutoff}%<br><br><b>${status}</b></div>`;
}
