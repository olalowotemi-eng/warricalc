<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuel Cost Calculator Warri to Lagos Nigeria</title>
<meta name="monetag" content="edb2a6fa12ef64fbd8b8e017ebdac663">
<style>body{font-family:Arial;background:#f1f5f9;padding:15px}.card{background:#fff;padding:16px;border-radius:12px;max-width:600px;margin:auto}input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #ccc}.btn{background:#22c55e;color:#fff;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}.result{background:#f0fdf4;border:2px solid #22c55e;padding:12px;margin-top:12px;text-align:center;font-weight:bold;border-radius:10px}</style>
</head><body><div class="card">
<h2>⛽ Fuel Cost Calculator Naija</h2><a href="index.html">← Home</a>
<input type="number" id="dist" placeholder="Distance KM e.g Warri to Lagos 400KM">
<input type="number" id="price" value="1000" placeholder="Fuel price per litre">
<input type="number" id="kmpl" value="12" placeholder="Car KM per litre (12 for car)">
<button class="btn" onclick="calc()">Calculate Fuel Cost</button><div id="res"></div>
</div><script>function calc(){let d=+dist.value||0,p=+price.value||0,k=+kmpl.value||1;let litres=(d/k).toFixed(1);let cost=(litres*p).toFixed(0);res.innerHTML='<div class="result">Fuel needed: '+litres+' litres<br>Total Cost: N'+cost+'<br>For Warri drivers!</div>';}</script></body></html>
