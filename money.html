<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warri Money - Full Converter</title>
<script src="https://quge5.com/tag.min.js" data-zone="9890912" data-cfasync="false" async></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif; background:#000; color:#fff; padding:10px; margin:0;}
.box{background:#FFD700; color:#000; padding:18px; border-radius:18px; border:4px solid #fff; max-width:520px; margin:auto;}
h1{text-align:center; margin:5px 0; font-size:28px; font-weight:900;}
.sub{text-align:center; font-weight:bold; margin-bottom:12px;}
label{font-weight:900; font-size:14px; display:block; margin-top:12px;}
select, input{width:100%; padding:14px; font-size:18px; border-radius:12px; border:3px solid #000; margin-top:6px; background:#fff;}
.row{display:flex; gap:10px;}
.row > div{flex:1;}
button{width:100%; padding:14px; font-size:20px; font-weight:900; background:#000; color:#FFD700; border:none; border-radius:12px; cursor:pointer; margin-top:15px;}
#result{background:#000; color:#fff; padding:16px; border-radius:12px; margin-top:16px; display:none;}
#result h3{color:#FFD700; margin:0 0 10px 0; text-align:center;}
.curr{font-size:17px; margin:6px 0; border-bottom:1px solid #333; padding-bottom:6px;}
#pidgin{color:#FFD700; font-size:19px; font-weight:900; text-align:center; margin-top:12px;}
.back{display:block; text-align:center; margin-top:16px; color:#000; background:#fff; padding:10px; border-radius:8px; text-decoration:none; font-weight:bold; border:2px solid #000;}
.swapBtn{background:#fff !important; color:#000 !important; border:3px solid #000 !important; font-size:16px !important; padding:8px !important; margin-top:8px !important;}
</style>
</head>
<body>
<div class="box">
<h1>💰 WARRI MONEY 💰</h1>
<p class="sub">Any Currency to Any Currency - No Long Story!</p>

<label>HOW MUCH?</label>
<input type="number" id="amount" value="2000" placeholder="Enter amount e.g 2000">

<div class="row">
<div>
<label>FROM (Wetin you get):</label>
<select id="fromCurr">
<option value="NGN">🇳🇬 NGN - Naira</option>
<option value="USD">🇺🇸 USD - Dollar</option>
<option value="GBP">🇬🇧 GBP - Pounds</option>
<option value="EUR">🇪🇺 EUR - Euro</option>
<option value="GHS">🇬🇭 GHS - Ghana Cedis</option>
<option value="ZAR">🇿🇦 ZAR - South Africa Rand</option>
<option value="KES">🇰🇪 KES - Kenya Shilling</option>
<option value="UGX">🇺🇬 UGX - Uganda Shilling</option>
<option value="XOF">🇸🇳 XOF - CFA Franc</option>
<option value="CAD">🇨🇦 CAD - Canada Dollar</option>
<option value="AUD">🇦🇺 AUD - Australia Dollar</option>
<option value="INR">🇮🇳 INR - India Rupee</option>
<option value="AED">🇦🇪 AED - Dubai Dirham</option>
<option value="SAR">🇸🇦 SAR - Saudi Riyal</option>
<option value="CNY">🇨🇳 CNY - China Yuan</option>
<option value="JPY">🇯🇵 JPY - Japan Yen</option>
<option value="BRL">🇧🇷 BRL - Brazil Real</option>
<option value="TRY">🇹🇷 TRY - Turkey Lira</option>
<option value="EGP">🇪🇬 EGP - Egypt Pound</option>
<option value="MAD">🇲🇦 MAD - Morocco Dirham</option>
</select>
</div>
<div>
<label>TO (Wetin you want):</label>
<select id="toCurr">
<option value="USD">🇺🇸 USD - Dollar</option>
<option value="NGN">🇳🇬 NGN - Naira</option>
<option value="GBP">🇬🇧 GBP - Pounds</option>
<option value="EUR">🇪🇺 EUR - Euro</option>
<option value="GHS">🇬🇭 GHS - Ghana Cedis</option>
<option value="ZAR">🇿🇦 ZAR - South Africa Rand</option>
<option value="KES">🇰🇪 KES - Kenya Shilling</option>
<option value="UGX">🇺🇬 UGX - Uganda Shilling</option>
<option value="XOF">🇸🇳 XOF - CFA Franc</option>
<option value="CAD">🇨🇦 CAD - Canada Dollar</option>
<option value="AUD">🇦🇺 AUD - Australia Dollar</option>
<option value="INR">🇮🇳 INR - India Rupee</option>
<option value="AED">🇦🇪 AED - Dubai Dirham</option>
<option value="SAR">🇸🇦 SAR - Saudi Riyal</option>
<option value="CNY">🇨🇳 CNY - China Yuan</option>
<option value="JPY">🇯🇵 JPY - Japan Yen</option>
<option value="BRL">🇧🇷 BRL - Brazil Real</option>
<option value="TRY">🇹🇷 TRY - Turkey Lira</option>
<option value="EGP">🇪🇬 EGP - Egypt Pound</option>
<option value="MAD">🇲🇦 MAD - Morocco Dirham</option>
</select>
</div>
</div>

<button class="swapBtn" onclick="swapCurr()">🔄 SWAP AM</button>
<button onclick="convertNow()">CONVERT AM NOW!</button>

<div id="result">
<h3>Result:</h3>
<div id="mainResult" style="font-size:26px; font-weight:900; color:#FFD700; text-align:center; margin-bottom:10px;"></div>
<div id="allList"></div>
<p id="pidgin"></p>
</div>

<a href="index.html" class="back">⬅ Back to WarriCalc</a>
</div>

<script>
const toUSD = {
NGN: 1650, USD: 1, GBP: 0.79, EUR: 0.92, GHS: 15.5, ZAR: 18.5, KES: 130, UGX: 3800, XOF: 600, CAD: 1.36, AUD: 1.52, INR: 83.5, AED: 3.67, SAR: 3.75, CNY: 7.2, JPY: 150, BRL: 5.1, TRY: 32, EGP: 50, MAD: 10.2
};
const symbols = {
NGN:"₦", USD:"$", GBP:"£", EUR:"€", GHS:"₵", ZAR:"R", KES:"KSh", UGX:"USh", XOF:"CFA ", CAD:"C$", AUD:"A$", INR:"₹", AED:"AED ", SAR:"SAR ", CNY:"¥", JPY:"¥", BRL:"R$", TRY:"₺", EGP:"E£", MAD:"MAD "
};
function swapCurr(){
let f=document.getElementById('fromCurr');
let t=document.getElementById('toCurr');
let tmp=f.value; f.value=t.value; t.value=tmp;
convertNow();
}
function convertNow(){
let amount=parseFloat(document.getElementById('amount').value);
let from=document.getElementById('fromCurr').value;
let to=document.getElementById('toCurr').value;
if(!amount){alert("Oga put amount first!"); return;}
let inUSD = amount / toUSD[from];
let result = inUSD * toUSD[to];
document.getElementById('mainResult').innerText = symbols[from] + amount.toLocaleString() + " = " + symbols[to] + result.toLocaleString(undefined,{maximumFractionDigits:2});
let listDiv=document.getElementById('allList');
listDiv.innerHTML="";
let quick=["USD","NGN","GBP","EUR","GHS"];
quick.forEach(c=>{
 if(c===from) return;
 let r = inUSD * toUSD[c];
 listDiv.innerHTML += `<div class="curr">${c}: ${symbols[c]}${r.toLocaleString(undefined,{maximumFractionDigits:2})}</div>`;
});
let talk="";
if(to==="NGN" && result>=1000000) talk="Oga you don hammer! Millionaire! 🔥💰";
else if(to==="NGN" && result>=100000) talk="Chairman money don enter! No long story!";
else if(amount>=10000 && from==="NGN") talk="Manage am, Warri no dey carry last! But you dey try!";
else if(result>=1000 && to==="USD") talk="Omo Dollar don land! You be big boy!";
else talk="Warri no dey carry last! Correct calculation!";
document.getElementById('pidgin').innerText = talk;
document.getElementById('result').style.display="block";
}
window.onload = convertNow;
</script>
</body>
</html>
