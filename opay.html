<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opay Fee Calculator</title>
<meta name="monetag" content="edb2a6fa12ef64fbd8b8e017ebdac663">
<style>body{font-family:Arial;background:#f1f5f9;padding:15px}.card{background:#fff;padding:16px;border-radius:12px;max-width:600px;margin:auto}input,select{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #ccc}.btn{background:#22c55e;color:#fff;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}.result{background:#f0fdf4;border:2px solid #22c55e;padding:12px;margin-top:12px;text-align:center;font-weight:bold;border-radius:10px}</style>
</head><body><div class="card">
<h2>💸 Opay Fee Calculator</h2><a href="index.html">← Home</a>
<input type="number" id="amt" placeholder="Amount e.g. 5000"><select id="type"><option value="opay">Opay to Opay - FREE</option><option value="bank">Opay to Bank - N10</option></select>
<button class="btn" onclick="calc()">Check Fee</button><div id="res"></div>
</div><script>function calc(){let a=+amt.value||0;let f=type.value=='opay'?0:10;res.innerHTML='<div class="result">Fee: N'+f+'<br>You get: N'+(a-f)+'</div>';}</script></body></html>
